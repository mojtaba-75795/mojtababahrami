<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="آموزش و حل تمرین صفحه‌به‌صفحه ریاضی پنجم و ششم و آموزش هوش و استعداد تیزهوشان ششم توسط مجتبی بهرامی">
<meta name="theme-color" content="#071426">
<title>آموزش و حل تمرین ریاضی | مجتبی بهرامی</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E">
<style>

*{box-sizing:border-box} body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#162033}
header{background:linear-gradient(135deg,#071426,#17345a);padding:18px 14px;text-align:center;box-shadow:0 4px 20px #0002}
.banner{width:min(1100px,100%);height:auto;object-fit:contain;border-radius:18px;display:block;margin:auto}


nav{position:sticky;top:0;z-index:10;background:#fff;box-shadow:0 2px 12px #0001;display:flex;justify-content:center;gap:10px;padding:10px;flex-wrap:wrap}
nav a{border:0;background:#eef3f9;color:#183153;padding:11px 18px;border-radius:12px;font-weight:700;cursor:pointer}
nav a.active{background:#173d68;color:#fff}
main{max-width:1100px;margin:28px auto;padding:0 16px}
.hero{text-align:center;margin-bottom:24px} .hero h1{margin:0 0 8px;font-size:30px} .hero p{color:#5d6b7e}
.search{width:100%;padding:14px 16px;border:1px solid #d5deea;border-radius:14px;font-size:16px;margin:12px 0 25px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;box-shadow:0 5px 20px #1b365d0d;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px #1b365d18}
.card h3{margin:0 0 8px;font-size:19px} .card p{margin:0;color:#69778a;font-size:14px}
.chapter{background:#fff;border-radius:18px;padding:22px;box-shadow:0 5px 20px #1b365d0d}
.back{border:0;background:#edf3f8;border-radius:10px;padding:9px 14px;cursor:pointer;margin-bottom:16px;font-weight:700}
.link{display:block;text-decoration:none;color:#12375f;background:#f7faff;border:1px solid #dce7f3;padding:14px 16px;border-radius:12px;margin:9px 0;font-weight:600}
.link:hover{background:#eaf3ff;border-color:#b9d0ea}
.empty{text-align:center;background:#fff;border:1px dashed #b9c6d5;border-radius:18px;padding:45px 20px;color:#69778a}
footer{text-align:center;padding:35px 15px;color:#69778a}
/* مرحله ۳: بخش آموزشی ریاضی پنجم */
.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 14px}
.sectionTitle h2{margin:0;font-size:24px}
.sectionTitle .badge{background:linear-gradient(135deg,#ff8a00,#ff4d6d);color:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800;box-shadow:0 5px 15px #ff5a3d33}
.gradeFeature{position:relative;overflow:hidden;background:linear-gradient(135deg,#fff7ed,#fff);border:1px solid #ffd8b0;border-radius:24px;padding:24px;box-shadow:0 12px 35px #f9731617;margin-bottom:22px}
.gradeFeature:before{content:'';position:absolute;left:-25px;top:-35px;width:120px;height:120px;border-radius:50%;background:#ffedd5}
.gradeFeature:after{content:'';position:absolute;right:-30px;bottom:-45px;width:150px;height:150px;border-radius:50%;background:#fef3c7}
.featureTop{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.featureTitle{display:flex;align-items:center;gap:14px}
.featureIcon{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#ff9f1c,#ff5d5d);color:#fff;font-size:29px;box-shadow:0 8px 20px #ff6b3533}
.featureTitle h3{margin:0 0 5px;font-size:21px}.featureTitle p{margin:0;color:#7a6b5d;font-size:13px}
.startBtn{border:0;background:#172554;color:#fff;border-radius:13px;padding:11px 17px;font-weight:800;cursor:pointer;box-shadow:0 7px 16px #1725542b;transition:.2s}.startBtn:hover{transform:translateY(-2px)}
.miniGrid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:20px}
.miniCard{background:#fff;border:1px solid #f1dcc7;border-radius:16px;padding:15px;cursor:pointer;transition:.2s}.miniCard:hover{transform:translateY(-3px);border-color:#ffb36b;box-shadow:0 9px 20px #ff8a0018}
.miniCard .num{display:inline-grid;place-items:center;width:31px;height:31px;border-radius:10px;background:#fff0df;color:#e65f00;font-weight:900;margin-bottom:9px}.miniCard strong{display:block;font-size:14px;line-height:1.8}.miniCard span{display:block;margin-top:5px;color:#8993a0;font-size:11px}

.grade6Feature{position:relative;overflow:hidden;background:linear-gradient(135deg,#eff6ff,#f8fafc);border:1px solid #bfdbfe;border-radius:24px;padding:24px;box-shadow:0 12px 35px #2563eb17;margin-bottom:22px}
.grade6Feature:before{content:'';position:absolute;right:-30px;top:-45px;width:145px;height:145px;border-radius:50%;background:#dbeafe}
.grade6Feature:after{content:'';position:absolute;left:-35px;bottom:-50px;width:155px;height:155px;border-radius:50%;background:#ccfbf1}
.grade6Feature .featureIcon{background:linear-gradient(135deg,#2563eb,#06b6d4);box-shadow:0 8px 20px #2563eb33}
.grade6Feature .startBtn{background:#1e3a8a;box-shadow:0 7px 16px #1e3a8a2b}
.grade6Feature .miniCard{border-color:#dbeafe}.grade6Feature .miniCard:hover{border-color:#60a5fa;box-shadow:0 9px 20px #2563eb18}
.grade6Feature .miniCard .num{background:#dbeafe;color:#1d4ed8}
@media(max-width:600px){.hero h1{font-size:24px} }

/* مرحله ۵: بخش ویژه تیزهوشان ششم */
.giftedFeature{position:relative;overflow:hidden;background:linear-gradient(135deg,#faf5ff,#fff);border:1px solid #ddd6fe;border-radius:24px;padding:24px;box-shadow:0 12px 35px #7c3aed18;margin-bottom:22px}
.giftedFeature:before{content:'';position:absolute;right:-35px;top:-50px;width:155px;height:155px;border-radius:50%;background:#ede9fe}
.giftedFeature:after{content:'';position:absolute;left:-35px;bottom:-55px;width:165px;height:165px;border-radius:50%;background:#fef3c7}
.giftedFeature .featureIcon{background:linear-gradient(135deg,#7c3aed,#c026d3);box-shadow:0 8px 20px #7c3aed33}
.giftedFeature .startBtn{background:#5b21b6;box-shadow:0 7px 16px #5b21b62b}
.giftedFeature .miniCard{border-color:#e9d5ff}.giftedFeature .miniCard:hover{border-color:#a78bfa;box-shadow:0 9px 20px #7c3aed18}
.giftedFeature .miniCard .num{background:#ede9fe;color:#6d28d9}
.giftedNote{position:relative;z-index:1;margin-top:18px;padding:12px 14px;border-radius:13px;background:#fff7ed;color:#7c4a03;font-size:13px;font-weight:700}

/* مرحله ۶ — دسترسی سریع و پایان‌بندی حرفه‌ای */
.quickNav{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 24px}
.quickItem{display:flex;align-items:center;gap:12px;padding:15px 16px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;cursor:pointer;transition:.25s;box-shadow:0 6px 18px rgba(0,0,0,.05)}
.quickItem:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(0,0,0,.09)}
.quickIcon{font-size:28px}.quickItem strong{display:block;font-size:15px}.quickItem span{display:block;color:#6b7280;font-size:12px;margin-top:4px}
.quick5{border-color:#fed7aa}.quick6{border-color:#bae6fd}.quickT{border-color:#ddd6fe}
.homeHint{padding:13px 16px;border-radius:16px;background:#f8fafc;border:1px solid #e2e8f0;color:#475569;margin:0 0 22px;font-size:13px}
.siteFooter{margin:28px 0 8px;padding:24px;text-align:center;border-radius:22px;background:linear-gradient(135deg,#111827,#1f2937);color:#fff;box-shadow:0 12px 30px rgba(15,23,42,.18)}
.footerTitle{font-size:19px;font-weight:900;margin-bottom:7px}.siteFooter p{margin:5px 0;color:#cbd5e1;font-size:13px}.footerTop{margin-top:14px;border:0;border-radius:12px;padding:9px 16px;background:#fff;color:#111827;font-family:inherit;font-weight:800;cursor:pointer}
@media(max-width:700px){.quickNav{grid-template-columns:1fr}.quickItem{padding:13px}}

/* مرحله ۷ — بهینه‌سازی نمایش در موبایل */
@media (max-width: 600px){
  body{font-size:14px;overflow-x:hidden}
  header{padding:8px 8px 0}
  .banner{width:100%;height:auto;border-radius:16px}
  nav{margin:8px 8px 0;display:flex;gap:7px;overflow-x:auto;justify-content:flex-start;padding:4px 2px 8px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav a{flex:0 0 auto;white-space:nowrap;padding:9px 12px;font-size:13px}
  main{padding:0 10px 24px}
  .hero{padding:20px 14px!important;border-radius:18px!important}
  .hero h1{font-size:23px!important;line-height:1.7}
  .hero p{font-size:13px!important}
  .search{font-size:14px!important;padding:12px 14px!important}
  .sectionTitle{margin:22px 0 12px}
  .sectionTitle h2{font-size:20px}
  .gradeFeature{padding:14px!important;border-radius:18px!important}
  .featureTop{flex-direction:column;align-items:stretch;gap:12px}
  .featureTitle{font-size:19px!important}
  .startBtn{width:100%;text-align:center;box-sizing:border-box}
  .miniGrid{grid-template-columns:1fr!important;gap:9px!important}
  .miniCard{padding:12px 13px!important}
  .quickNav{grid-template-columns:1fr!important;gap:9px!important}
  .quickItem{padding:12px 13px!important}
  .link{font-size:13px!important;padding:12px 13px!important}
  .chapter{padding:14px!important;border-radius:18px!important}
  .chapter h2{font-size:19px!important;line-height:1.7}
  footer{padding:20px 10px;font-size:12px}
}

/* Stage 8 - interactive learning cards */
.chapterCard,.miniCard,.featureTop,.startBtn,.resourceCard{transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.chapterCard:hover,.miniCard:hover{transform:translateY(-5px);box-shadow:0 12px 28px rgba(0,0,0,.14)}
.chapterCard{position:relative;overflow:hidden}
.chapterCard::after{content:"";position:absolute;inset:auto -35px -55px auto;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.16);pointer-events:none}
.resourceCard{position:relative;border-radius:18px}
.resourceCard:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.12)}
.resourceCard .linkArrow{display:inline-block;transition:transform .2s ease}
.resourceCard:hover .linkArrow{transform:translateX(-5px)}
@media(max-width:700px){.chapterCard:hover,.miniCard:hover,.resourceCard:hover{transform:none}}


/* مرحله ۱۰: معرفی حرفه‌ای و خلاصه اطلاعات آموزشی */
.homeStats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 24px}
.statBox{position:relative;overflow:hidden;background:#fff;border:1px solid #e3eaf3;border-radius:18px;padding:18px;text-align:center;box-shadow:0 8px 24px #19365a10}
.statBox:after{content:"";position:absolute;inset:auto 0 0;height:4px;background:linear-gradient(90deg,#173d68,#b58a2a)}
.statIcon{font-size:30px;margin-bottom:7px}.statNumber{font-size:24px;font-weight:900;color:#173d68}.statLabel{display:block;margin-top:5px;color:#637083;font-size:13px}
.welcomePanel{background:linear-gradient(135deg,#102a49,#1e4b73);color:#fff;border-radius:22px;padding:24px 22px;margin:0 0 24px;box-shadow:0 12px 30px #102a4925;display:flex;align-items:center;justify-content:space-between;gap:18px}
.welcomePanel h2{margin:0 0 7px;font-size:22px}.welcomePanel p{margin:0;color:#e5edf7;line-height:1.9}.welcomeBadge{background:#fff;color:#173d68;border-radius:14px;padding:10px 15px;font-weight:900;white-space:nowrap}
@media(max-width:700px){.homeStats{grid-template-columns:1fr;gap:10px}.statBox{padding:14px}.welcomePanel{display:block;text-align:center;padding:20px}.welcomeBadge{display:inline-block;margin-top:14px}}

/* مرحله ۱۲ - نشانگر پیشرفت یادگیری */
.progressBox{margin:18px 0;padding:18px;border-radius:20px;background:linear-gradient(135deg,#eef7ff,#f8fbff);border:1px solid #dbeafe;box-shadow:0 8px 24px rgba(30,64,175,.08)}
.progressHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.progressHead b{font-size:18px}.progressPct{font-weight:800;font-size:18px;color:#2563eb}
.progressTrack{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.progressFill{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#06b6d4);border-radius:999px;transition:width .35s ease}
.progressHint{margin:10px 0 0;color:#64748b;font-size:13px}
@media(max-width:600px){.progressHead{align-items:flex-start;flex-direction:column;gap:4px}}


/* ---- اصلاحات ---- */
:root{color-scheme:light}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
main:focus{outline:none}
nav a{display:inline-block;text-decoration:none;font-family:inherit;font-size:inherit}
a.card,a.miniCard{display:block;color:inherit;text-decoration:none}
a.quickItem{color:inherit;text-decoration:none}
a.startBtn{display:inline-block;text-align:center;text-decoration:none;color:#fff}
a.back{display:inline-block;text-decoration:none;color:#162033}
.recentGo{display:inline-block;text-decoration:none;text-align:center}
.link.done{background:#f0fdf4;border-color:#bbf7d0}
.link.done::before{content:"✓ ";color:#16a34a;font-weight:900}
.resultMeta{margin:18px 0 6px;color:#64748b;font-size:13px}
.search:focus{outline:3px solid #2563eb33;border-color:#2563eb}
.noscript{padding:30px;text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

</style>
<style id="stage13-recent-style">

.recentPanel{margin:22px 0;padding:18px;border-radius:20px;background:linear-gradient(135deg,#fff,#f5f7ff);border:1px solid #e2e6f3;box-shadow:0 8px 24px rgba(35,45,90,.08)}
.recentPanel h2{margin:0 0 14px;color:#26345f;font-size:20px}.recentList{display:grid;gap:10px}.recentItem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:#fff;border-radius:14px;border:1px solid #e8eaf2}.recentItem span{font-weight:700;color:#374151}.recentItem small{display:block;color:#7b8495;margin-top:3px;font-weight:400}.recentGo{border:0;border-radius:10px;padding:8px 12px;background:#eef1ff;color:#3949ab;cursor:pointer;font-family:inherit;font-weight:700}.recentEmpty{color:#7b8494;font-size:14px}.recentClear{margin-top:12px;border:0;background:transparent;color:#9b4d4d;cursor:pointer;font-family:inherit}.recentBadge{font-size:12px;padding:5px 9px;border-radius:999px;background:#f0f2f8;color:#667085;white-space:nowrap}
@media(max-width:600px){.recentItem{align-items:flex-start;flex-direction:column}.recentGo{width:100%}}

</style>
</head>

 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
 del(k){try{localStorage.removeItem(k)}catch(e){}}
};
function norm(s){
 return String(s).toLowerCase()
  .replace(/ي/g,'ی').replace(/ى/g,'ی').replace(/ئ/g,'ی').replace(/ك/g,'ک')
  .replace(/ؤ/g,'و').replace(/[أإآ]/g,'ا').replace(/[ةۀ]/g,'ه')
  .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
  .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
  .replace(/[\u200c\u200d]/g,' ')
  .replace(/[\u0640\u064b-\u065f]/g,'')
  .replace(/\s+/g,' ').trim();
}

/* ---------- ثبت بازدید ---------- */
function track(a){
 const href=a.getAttribute('href'); if(!href) return;
 const title=a.dataset.title||a.textContent.replace('↗','').trim();
 const v=visitedSet(); v.add(href); store.set(VISITED_KEY,[...v]);
 let r=store.get(RECENT_KEY,[]); if(!Array.isArray(r)) r=[];
 r=r.filter(x=>x&&x.href!==href); r.unshift({href,title,time:Date.now()});
 store.set(RECENT_KEY,r.slice(0,5));
 a.classList.add('done');
 refreshProgress();
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-track]'); if(t){track(t);return}
 const act=e.target.closest('[data-action]'); if(!act) return;
 if(act.dataset.action==='top') window.scrollTo({top:0,behavior:'smooth'});
 if(act.dataset.action==='clear-recent'){store.del(RECENT_KEY);renderRecent()}
});
document.addEventListener('auxclick',e=>{ if(e.button!==1) return; const t=e.target.closest('[data-track]'); if(t) track(t) });

}

}
function refreshProgress(){
 document.querySelectorAll('.progressBox').forEach(box=>{

  box.querySelector('.progressPct').textContent=fa(pct)+'٪';
  box.querySelector('.progressTrack').setAttribute('aria-valuenow',pct);
  box.querySelector('.progressHint').textContent=`${fa(done)} از ${fa(urls.length)} آموزش دیده‌شده — پیشرفت شما فقط در همین مرورگر ذخیره می‌شود.`;
 });
}

 <input class="search" id="search" type="search" aria-label="جست‌وجو در آموزش‌ها" placeholder="🔎 جست‌وجو در فصل‌ها و موضوعات..." autocomplete="off">

 <div id="homeContent">
 <div id="recentHomeBar"></div>

 <div class="homeStats"><div class="statBox"><div class="statIcon">📚</div><div class="statNumber">${fa(nCh)} فصل</div><span class="statLabel">ریاضی پنجم و ششم</span></div><div class="statBox"><div class="statIcon">🧠</div><div class="statNumber">هوش و استعداد</div><span class="statLabel">ویژه تیزهوشان ششم</span></div><div class="statBox"><div class="statIcon">🔎</div><div class="statNumber">جست‌وجوی سریع</div><span class="statLabel">برای پیدا کردن آموزش‌ها</span></div></div>
 <div class="quickNav">
  <a class="quickItem quick5" href="#/g/5"><div class="quickIcon">📕</div><div><strong>ریاضی پنجم</strong><span>${fa(fifth.length)} فصل آموزشی</span></div></a>
  <a class="quickItem quick6" href="#/g/6"><div class="quickIcon">📗</div><div><strong>ریاضی ششم</strong><span>${fa(sixth.length)} فصل آموزشی</span></div></a>
  <a class="quickItem quickT" href="#/t"><div class="quickIcon">🧠</div><div><strong>تیزهوشان ششم</strong><span>هوش و استعداد</span></div></a>
 </div>
 <div class="homeHint">💡 <b>راهنمای سایت:</b> فصل یا مبحث موردنظر را انتخاب کنید؛ سپس با یک کلیک وارد آموزش اصلی شوید.</div>
 <div class="sectionTitle"><h2>شروع یادگیری</h2></div>
 <section class="gradeFeature">
   <div class="featureTop"><div class="featureTitle"><div class="featureIcon">📕</div><div><h3>ریاضی پنجم</h3><p>${fa(fifth.length)} فصل آموزشی؛ از عددنویسی تا آمار و احتمال</p></div></div><a class="startBtn" href="#/g/5">مشاهده همه فصل‌ها ←</a></div>
   <div class="miniGrid">${mini('5')}</div>
 </section>
 <section class="grade6Feature">
   <div class="featureTop"><div class="featureTitle"><div class="featureIcon">📗</div><div><h3>ریاضی ششم</h3><p>${fa(sixth.length)} فصل آموزشی؛ از الگوهای عددی تا تقریب و ترتیب عملیات</p></div></div><a class="startBtn" href="#/g/6">مشاهده همه فصل‌ها ←</a></div>
   <div class="miniGrid">${mini('6')}</div>
 </section>
 <section class="giftedFeature">
   <div class="featureTop"><div class="featureTitle"><div class="featureIcon">🧠</div><div><h3>تیزهوشان ششم</h3><p>آموزش کتاب هوش کمپلکس؛ تمرین مباحث مهم هوش و استعداد</p></div></div><a class="startBtn" href="#/t">مشاهده همه مباحث ←</a></div>
   <div class="miniGrid">${giftedMini}</div>
   <div class="giftedNote">💡 با انتخاب هر مبحث، ویدیوی آموزشی همان مبحث در آپارات باز می‌شود.</div>
 </section>
 <div class="siteFooter"><div class="footerTitle">آموزش و حل تمرین ریاضی</div><p>ریاضی پنجم و ششم + تیزهوشان ششم</p><p>تهیه و ارائه: مجتبی بهرامی</p><button class="footerTop" type="button" data-action="top">↑ بازگشت به بالای صفحه</button></div>
 </div>`;
 renderRecent();
 document.getElementById('search').addEventListener('input',e=>searchAll(e.target.value));
}
function showGrade(g){
 setNav(GR[g].nav);
 const G=GR[g];
 const done=visitedSet();
 app.innerHTML=`<section class="hero"><h1>${G.icon} ${G.name}</h1><p>برای مشاهده آموزش‌ها، فصل موردنظر را انتخاب کنید.</p></section>${progressHTML(g)}
 <div class="grid">${G.data.map((x,i)=>{const d=x[1].filter(y=>done.has(y[1])).length;return `<a class="card" href="#/c/${g}/${i}"><h3>${esc(x[0])}</h3><p>${fa(x[1].length)} آموزش${d?` · ${fa(d)} دیده‌شده`:''}</p></a>`}).join('')}</div>`;
}
function showChapter(g,i){
 const G=GR[g], x=G.data[i];
 setNav(G.nav);
 app.innerHTML=`<div class="chapter chapterCard"><a class="back" href="#/g/${g}">← بازگشت به فصل‌ها</a><h2>${esc(x[0])}</h2><p>برای مشاهده حل و آموزش، روی موضوع موردنظر کلیک کنید.</p>${x[1].map(lessonLink).join('')}</div>`;
}
function showGifted(){
 setNav('navT');
 app.innerHTML=`<section class="hero"><h1>🧠 تیزهوشان ششم</h1><p>آموزش مباحث هوش و تیزهوشان — کتاب هوش کمپلکس</p></section>${progressHTML('t')}
 ${gifted.map(c=>`<div class="chapter chapterCard"><h2>${esc(c[0])}</h2><p>برای مشاهده آموزش، روی مبحث موردنظر کلیک کنید.</p>${c[1].map(lessonLink).join('')}</div>`).join('')}`;
}

/* ---------- جست‌وجو ---------- */
const INDEX=[];
[['5','📕 ریاضی پنجم','ریاضی پنجم',fifth],['6','📗 ریاضی ششم','ریاضی ششم',sixth],['t','🧠 تیزهوشان ششم','تیزهوشان ششم',gifted]].forEach(([g,label,plain,data],gi)=>{
 const d=g==='5'?fifth:g==='6'?sixth:gifted;
 d.forEach((c,ci)=>c[1].forEach(y=>INDEX.push({g,label,plain,ch:c[0],chHref:g==='t'?'#/t':`#/c/${g}/${ci}`,title:y[0],url:y[1],nt:norm(y[0]),nc:norm(plain+' '+c[0])})));
});
function searchAll(q){
 const box=document.getElementById('results'), home=document.getElementById('homeContent'); if(!box) return;
 const tokens=norm(q).split(' ').filter(Boolean);
 if(!tokens.length){box.innerHTML='';if(home) home.hidden=false;return}
 if(home) home.hidden=true;
 const hits=INDEX.map(it=>{
  const inTitle=tokens.every(t=>it.nt.includes(t));
  const inAny=tokens.every(t=>it.nt.includes(t)||it.nc.includes(t));
  return inAny?{it,r:inTitle?0:1}:null;
 }).filter(Boolean).sort((a,b)=>a.r-b.r);
 if(!hits.length){box.innerHTML='<div class="empty" style="margin-top:20px">نتیجه‌ای پیدا نشد.</div>';return}
 const MAX=50, shown=hits.slice(0,MAX), done=visitedSet();
 box.innerHTML=`<div class="resultMeta">${fa(hits.length)} نتیجه${hits.length>MAX?` (نمایش ${fa(MAX)} مورد اول — عبارت دقیق‌تری بنویسید)`:''}</div>`+
  shown.map(({it})=>`<a class="link resourceCard${done.has(it.url)?' done':''}" href="${esc(it.url)}" target="_blank" rel="noopener" data-track data-title="${esc(it.title)}"><b>${it.label}</b> — ${esc(it.ch)} — ${esc(it.title)} ↗</a>`).join('');
}

/* ---------- مسیریابی ---------- */
/* صفحه مستقیماً از روی مسیر رندر می‌شود؛ آدرس مرورگر فقط یک امکان اضافه است
   (برای Back/لینک مستقیم) و اگر در محیطی مثل iframe ایزوله کار نکرد، سایت همچنان کار می‌کند. */
let firstRoute=true, lastPath=null;
function currentHash(){try{return location.hash||''}catch(e){return ''}}
function route(hash){
 hash=hash||'';
 lastPath=hash;
 let p=[];
 try{p=hash.replace(/^#\/?/,'').split('/').filter(Boolean).map(decodeURIComponent)}catch(e){p=[]}
 const idx=Number(p[2]);
 let title='آموزش و حل تمرین ریاضی | مجتبی بهرامی';
 if(p[0]==='g'&&GR[p[1]]){showGrade(p[1]);title=GR[p[1]].name+' | '+title}
 else if(p[0]==='c'&&GR[p[1]]&&Number.isInteger(idx)&&GR[p[1]].data[idx]){showChapter(p[1],idx);title=GR[p[1]].data[idx][0]+' — '+GR[p[1]].name+' | '+title}
 else if(p[0]==='t'){showGifted();title='تیزهوشان ششم | '+title}
 else showHome();
 document.title=title;
 if(!firstRoute){window.scrollTo(0,0);try{app.focus({preventScroll:true})}catch(e){}}
 firstRoute=false;
}
function go(hash){
 route(hash);
 try{ if(currentHash()!==hash) history.pushState(null,'',hash) }catch(e){}
}
document.addEventListener('click',e=>{
 const a=e.target.closest('a[href^="#/"]');
 if(!a||e.defaultPrevented||e.button!==0||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey) return;
 e.preventDefault();
 go(a.getAttribute('href'));
});
const onNav=()=>{const h=currentHash(); if(h!==lastPath) route(h)};
window.addEventListener('popstate',onNav);
window.addEventListener('hashchange',onNav);
route(currentHash());

</script>
